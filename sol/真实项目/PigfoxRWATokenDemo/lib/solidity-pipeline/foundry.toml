# This repo ships one Solidity file — src/PigfoxProperties.sol, the shared
# property-harness base. It carries a Foundry project only so CI can prove that
# file still compiles and stays formatted; there is nothing here to deploy and
# no test suite of its own. The gates that matter here are shell, and
# scripts/selftest.sh drives them.
#
# No [rpc_endpoints] block, deliberately, and no network of any kind. Consuming
# repos target Base Sepolia (84532) directly.
[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
